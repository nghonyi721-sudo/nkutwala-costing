<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the bars sit correctly around the notch and
         home indicator (the app pads itself with the safe-area insets). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Safari's own toolbars match the app in light and dark mode. -->
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- "Add to Home Screen" on iPhone opens it full screen, like an app
         (the apple- tag for older iPhones). The status bar stays light with
         dark text, to suit the light header. The install details are in the
         web app manifest (vite.config.js). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nkutwala" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Nkutwala Site Reports</title>
    <!-- The launch screen (#splash below), "Turning gear". Written into the
         page so it shows before any JavaScript or stylesheet arrives: the
         logo drawn as vector shapes, its half gear turning while the app
         loads. The words are outlines of the logo's own fonts (Fira Sans
         Extra Condensed Bold / Fira Sans Italic, SIL Open Font License), so
         no font file is downloaded. Background colours match the manifest's
         background_color (vite.config.js) and the app's own, so there is no
         colour flash. It is a full-screen layer only while it exists:
         src/lib/splash.js REMOVES it once the first screen is ready. It never
         touches html/body (no overflow:hidden, no 100vh, no scroll locking). -->
    <style>
      .splash {
        --s-bg: #f2f2f7;
        --s-ink: #0b0d12;
        --s-ink-2: #5f646c;
        --s-blue: #001aff;
        --s-red: #c20116;
        --s-dot: #000;
        --s-accent: #2d3eaa;
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
        background: var(--s-bg);
        color: var(--s-ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        text-align: center;
        transition: opacity 0.2s ease;
      }

      @media (prefers-color-scheme: dark) {
        .splash {
          --s-bg: #000;
          --s-ink: #fff;
          --s-ink-2: #aeaeb2;
          --s-blue: #3d4dff;
          --s-red: #e0303f;
          --s-dot: #fff;
          --s-accent: #3b4cc0;
        }
      }

      .splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .splash p {
        margin: 0;
      }

      /* The logo mark: the N (blue and red blades) and the half gear. The
         box is a little wider than the still logo so the turning gear has
         room on the right. */
      .splash-mark {
        display: block;
        width: min(220px, 58vw);
        height: auto;
        overflow: visible;
      }

      .splash-blue {
        fill: var(--s-blue);
      }

      .splash-red {
        fill: var(--s-red);
      }

      .splash-dot {
        fill: var(--s-dot);
      }

      .splash-ink {
        fill: var(--s-ink);
      }

      /* The one animation: the gear (with its dot) turns around its centre
         (an invisible full circle makes the turning point the centre). */
      .splash-gear {
        transform-box: fill-box;
        transform-origin: center;
        animation: splash-turn 4s linear infinite;
      }

      @keyframes splash-turn {
        to {
          transform: rotate(360deg);
        }
      }

      .splash-words {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .splash-lockup {
        display: block;
        width: min(210px, 56vw);
        height: auto;
      }

      .splash-tag {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .splash-tag svg {
        display: block;
        width: 112px;
        height: auto;
        fill: var(--s-ink-2);
      }

      .splash-tag::before,
      .splash-tag::after {
        content: '';
        width: 24px;
        height: 2px;
        background: var(--s-red);
      }

      .splash-wait,
      .splash-slow {
        display: none;
      }

      .splash-wait {
        font-size: 15px;
        color: var(--s-ink-2);
      }

      /* After 10 seconds: a message and Try again; the gear stops. */
      .splash.is-slow .splash-gear {
        animation-play-state: paused;
      }

      .splash.is-slow .splash-wait {
        display: none;
      }

      .splash.is-slow .splash-slow {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 320px;
      }

      .splash-message {
        font-size: 17px;
        line-height: 1.35;
      }

      .splash-retry {
        min-width: 160px;
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: var(--s-accent);
        color: #fff;
        font: inherit;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
      }

      /* Reduce Motion: the gear stays still (as in the logo), a still
         "Loading…" line, no fade. */
      @media (prefers-reduced-motion: reduce) {
        .splash {
          transition: none;
        }

        .splash-gear {
          animation: none;
        }

        .splash-wait {
          display: block;
        }
      }
    </style>
  </head>

    <script>
      // The launch screen's own timer - plain JavaScript in the page, so it
      // works even while the app itself is still downloading. After 10
      // seconds it swaps in a message and Try again (which reloads). If the
      // app has already removed the splash, it does nothing.
      ;(function () {
        var splash = document.getElementById('splash')
        var message = document.getElementById('splash-message')

        function describe() {
          message.textContent =
            navigator.onLine === false
              ? "You're offline — connect to the internet, then try again."
              : 'Taking longer than usual — check your signal.'
        }

        document.getElementById('splash-retry').addEventListener('click', function () {
          window.location.reload()
        })

        window.setTimeout(function () {
          if (!splash.isConnected) return
          describe()
          splash.classList.add('is-slow')
          window.addEventListener('online', describe)
          window.addEventListener('offline', describe)
        }, 10000)
      })()
    </script>
